name: Release

# Se dispara al empujar un tag tipo v10.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necesario para crear el Release y subir los .nupkg

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # La version del tag (v10.0.0 -> 10.0.0) se usa para los paquetes
      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --no-restore

      - name: Create packages
        run: dotnet pack -c Release --no-restore -o ../artifacts -p:PackageVersion=${{ steps.ver.outputs.version }}

      - name: List artifacts
        working-directory: .
        run: ls -la artifacts

      # Crea el Release del tag y adjunta los paquetes como assets descargables
      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.nupkg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
