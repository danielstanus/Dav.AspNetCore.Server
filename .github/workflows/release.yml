name: Release

# Se dispara al empujar un tag tipo v10.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necesario para crear el Release y subir los .nupkg

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # La version del tag (v10.0.0 -> 10.0.0) se usa para los paquetes
      - name: Derive version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: dotnet restore

      # Extrae la seccion del CHANGELOG de esta version para usarla como cuerpo del Release
      # (fuente unica de verdad). Si no existe la seccion, se usan las notas auto-generadas.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version="${{ steps.ver.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' ../CHANGELOG.md > ../release-notes.md
          if [ -s ../release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "----- release notes -----"
            cat ../release-notes.md
          else
            rm -f ../release-notes.md
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CHANGELOG section found for $version; using generated notes."
          fi

      - name: Test
        run: dotnet test -c Release --no-restore

      - name: Create packages
        run: dotnet pack -c Release --no-restore -o ../artifacts -p:Version=${{ steps.ver.outputs.version }} -p:PackageVersion=${{ steps.ver.outputs.version }}

      - name: List artifacts
        working-directory: .
        run: ls -la artifacts

      # Crea (o recrea) el Release del tag y adjunta los paquetes como assets descargables
      - name: Create GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              artifacts/*.nupkg \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              artifacts/*.nupkg \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
